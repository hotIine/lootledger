name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: capture/go.mod
          cache-dependency-path: capture/go.sum

      - run: npm ci
      - run: npm run package -- --publish never

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/build/LootLedger.exe
          generate_release_notes: true
